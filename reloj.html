<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vision 3D</title>
    <style>
      :root {
        --fg: rgba(255, 255, 255, 0.92);
        --dim: rgba(255, 255, 255, 0.55);
        --glass: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.14);
        --accent: #39ff88;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--fg);
        font-family: 'Ubuntu', 'Inter', system-ui, sans-serif;
        cursor: none;
      }
      canvas {
        display: block;
      }

      #title {
        position: fixed;
        top: 4vh;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 300;
        letter-spacing: 0.55em;
        text-transform: uppercase;
        font-size: clamp(14px, 1.6vw, 28px);
        color: var(--dim);
        text-indent: 0.55em;
        pointer-events: none;
      }
      #title:empty {
        display: none;
      }

      #invite {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 5vh;
        text-align: center;
        pointer-events: none;
        transition: opacity 1.2s ease;
      }
      #invite .big {
        font-size: clamp(20px, 2.4vw, 44px);
        font-weight: 300;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        text-indent: 0.35em;
        animation: breathe 3.2s ease-in-out infinite;
      }
      #invite .small {
        margin-top: 1.2vh;
        font-size: clamp(12px, 1.1vw, 20px);
        color: var(--dim);
        letter-spacing: 0.2em;
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      #invite .ring {
        width: 46px;
        height: 46px;
        margin: 0 auto 2vh;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.7);
        position: relative;
      }
      #invite .ring::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.8);
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse {
        from {
          transform: scale(1);
          opacity: 0.9;
        }
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      #guide {
        position: fixed;
        left: 50%;
        bottom: 3.5vh;
        transform: translateX(-50%);
        display: flex;
        gap: clamp(8px, 1.4vw, 28px);
        padding: 1.1vh 1.8vw;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--line);
        backdrop-filter: blur(10px);
        font-size: clamp(11px, 0.95vw, 18px);
        color: var(--dim);
        white-space: nowrap;
        transition: opacity 1s ease;
        pointer-events: none;
      }
      #guide span {
        display: flex;
        align-items: center;
        gap: 0.5em;
        transition:
          color 0.3s,
          transform 0.3s;
      }
      #guide svg {
        width: 1.5em;
        height: 1.5em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #guide em {
        font-style: normal;
        color: var(--fg);
        opacity: 0.75;
        letter-spacing: 0.04em;
      }
      #guide span {
        letter-spacing: 0.06em;
        text-transform: lowercase;
      }
      #guide span.on {
        color: var(--fg);
        transform: scale(1.08);
      }

      #toast {
        position: fixed;
        left: 0;
        right: 0;
        top: 12vh;
        text-align: center;
        pointer-events: none;
        font-size: clamp(18px, 2.2vw, 40px);
        font-weight: 300;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0;
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
        transform: translateY(-10px);
        text-shadow: 0 0 24px rgba(57, 255, 136, 0.6);
      }
      #toast.show {
        opacity: 1;
        transform: none;
      }

      #debug {
        position: fixed;
        right: 12px;
        bottom: 12px;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: var(--dim);
        white-space: pre;
        text-align: right;
        pointer-events: none;
        display: none;
      }
      body.debug #debug {
        display: block;
      }
      #dot {
        position: fixed;
        right: 14px;
        top: 14px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f55;
        opacity: 0.6;
      }
      #dot.ok {
        background: #4f8;
        opacity: 0.25;
      }
      .hidden {
        opacity: 0 !important;
      }

      /* aviso de borde: la mano está por salir del campo de la cámara */
      .edge {
        position: fixed;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .edge.on {
        opacity: 1;
        animation: edgePulse 1.1s ease-in-out infinite;
      }
      #edge-l,
      #edge-r {
        top: 0;
        bottom: 0;
        width: 9vw;
      }
      #edge-t,
      #edge-b {
        left: 0;
        right: 0;
        height: 12vh;
      }
      #edge-l {
        left: 0;
        background: linear-gradient(90deg, rgba(57, 255, 136, 0.35), transparent);
      }
      #edge-r {
        right: 0;
        background: linear-gradient(270deg, rgba(57, 255, 136, 0.35), transparent);
      }
      #edge-t {
        top: 0;
        background: linear-gradient(180deg, rgba(57, 255, 136, 0.35), transparent);
      }
      #edge-b {
        bottom: 0;
        background: linear-gradient(0deg, rgba(57, 255, 136, 0.35), transparent);
      }
      @keyframes edgePulse {
        50% {
          filter: brightness(1.6);
        }
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
    </script>
  </head>
  <body>
    <div id="title"></div>
    <div id="toast"></div>
    <div id="invite">
      <div class="ring"></div>
      <div class="big">Levanta la mano</div>
      <div class="small">A UNO O DOS METROS DE LA PANTALLA</div>
    </div>
    <div id="guide" class="hidden">
      <span data-g="open"
        ><svg viewBox="0 0 24 24">
          <path d="M18 11V6a2 2 0 0 0-4 0" />
          <path d="M14 10V4a2 2 0 0 0-4 0v2" />
          <path d="M10 10.5V6a2 2 0 0 0-4 0v8" />
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15" /></svg
        ><em>Mano abierta</em>apunta</span
      >
      <span data-g="grab"
        ><svg viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-2.6-6.4" />
          <path d="M21 3v6h-6" /></svg
        ><em>Puño</em>sujeta y gira</span
      >
      <span data-g="zoom"
        ><svg viewBox="0 0 24 24">
          <path d="M15 3h6v6" />
          <path d="M9 21H3v-6" />
          <path d="M21 3l-7 7" />
          <path d="M3 21l7-7" /></svg
        ><em>Dos puños</em>acerca</span
      >
    </div>
    <div id="edge-l" class="edge"></div>
    <div id="edge-r" class="edge"></div>
    <div id="edge-t" class="edge"></div>
    <div id="edge-b" class="edge"></div>
    <div id="dot"></div>
    <div id="debug"></div>
    <script type="module" src="./modules/clock/reloj.js"></script>
  </body>
</html>
